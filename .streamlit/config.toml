[theme]
primaryColor = "#D4AF37"          # The Gold from your podium
base = "dark"
backgroundColor = "#000000"       # Solid black background
secondaryBackgroundColor = "#1A1A1A" # Dark grey for sidebars/widgets
textColor = "#E0E0E0"             # Light grey for readability
font = "sans serif"

[server]
# This helps with app stability when deploying
headless = true
enableCORS = false
enableXsrfProtection = false
